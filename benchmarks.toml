[[benchmark]]
name = "xoptions_pde"
path = "xoptions_pde.py"
repeats = 5
warmups = 1
baseline_fortran_seconds = 0.21
min_source_seconds_for_source_ratio = 1.0
warn_if_fortran_slower_than_source = 1.5
fail_if_fortran_slower_than_source = 2.5
